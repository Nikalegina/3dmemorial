name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - run: npm run test
      - run: npm run build

      - name: Browser smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-artifacts
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/3dmemorial-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/3dmemorial-vite.log
            exit 1
          fi

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is not available on the runner"
            exit 1
          fi

          browser_dump() {
            local url="$1"
            local output="$2"
            local window_size="${3:-1440,1100}"
            local attempt
            for attempt in 1 2 3; do
              local profile
              profile="$(mktemp -d)"
              if timeout 40s "$CHROME"                 --headless=new                 --no-sandbox                 --disable-dev-shm-usage                 --disable-background-networking                 --disable-component-update                 --disable-sync                 --enable-unsafe-swiftshader                 --use-angle=swiftshader                 --window-size="$window_size"                 --virtual-time-budget=8000                 --user-data-dir="$profile"                 --dump-dom                 "$url" > "$output"; then
                rm -rf "$profile"
                if grep -q 'data-webgl-ready="true"' "$output"; then
                  return 0
                fi
              else
                rm -rf "$profile"
              fi
              echo "WebGL DOM attempt $attempt failed for $url" >&2
              sleep 1
            done
            echo "WebGL readiness was not reached for $url" >&2
            return 1
          }

          browser_screenshot() {
            local url="$1"
            local output="$2"
            local window_size="${3:-1440,1100}"
            local attempt
            for attempt in 1 2 3; do
              local profile
              profile="$(mktemp -d)"
              if timeout 40s "$CHROME"                 --headless=new                 --no-sandbox                 --disable-dev-shm-usage                 --disable-background-networking                 --disable-component-update                 --disable-sync                 --enable-unsafe-swiftshader                 --use-angle=swiftshader                 --window-size="$window_size"                 --virtual-time-budget=8000                 --user-data-dir="$profile"                 --screenshot="$output"                 "$url"; then
                rm -rf "$profile"
                if [ -s "$output" ]; then
                  return 0
                fi
              else
                rm -rf "$profile"
              fi
              echo "Screenshot attempt $attempt failed for $url" >&2
              sleep 1
            done
            echo "Screenshot was not produced for $url" >&2
            return 1
          }

          SINGLE_URL="http://127.0.0.1:4173/"
          browser_dump "$SINGLE_URL" browser-artifacts/single-dom.html
          grep -q 'data-startup-source="default"' browser-artifacts/single-dom.html
          grep -q 'data-visible-steles="1"' browser-artifacts/single-dom.html
          grep -q 'Оставить заявку для расчёта' browser-artifacts/single-dom.html
          browser_screenshot "$SINGLE_URL" browser-artifacts/single.png

          PAIRED_URL="http://127.0.0.1:4173/?preset=paired-glass&sourceSku=KM-PAIR-001"
          browser_dump "$PAIRED_URL" browser-artifacts/paired-dom.html
          grep -q 'data-startup-source="catalog"' browser-artifacts/paired-dom.html
          grep -q 'data-preset-id="paired-glass"' browser-artifacts/paired-dom.html
          grep -q 'data-source-sku="KM-PAIR-001"' browser-artifacts/paired-dom.html
          grep -q 'data-visible-steles="2"' browser-artifacts/paired-dom.html
          browser_screenshot "$PAIRED_URL" browser-artifacts/paired-glass.png

          MODERN_GLASS_URL="http://127.0.0.1:4173/?preset=modern-glass&sourceSku=KM-GLASS-001"
          browser_dump "$MODERN_GLASS_URL" browser-artifacts/modern-glass-dom.html
          grep -q 'data-startup-source="catalog"' browser-artifacts/modern-glass-dom.html
          grep -q 'data-preset-id="modern-glass"' browser-artifacts/modern-glass-dom.html
          grep -q 'data-source-sku="KM-GLASS-001"' browser-artifacts/modern-glass-dom.html
          grep -q 'data-visible-steles="1"' browser-artifacts/modern-glass-dom.html
          grep -q 'Крупная фотопечать' browser-artifacts/modern-glass-dom.html
          grep -q 'Технические параметры стекла' browser-artifacts/modern-glass-dom.html
          grep -q '12 мм (6+6)' browser-artifacts/modern-glass-dom.html
          grep -q 'Монтаж в паз' browser-artifacts/modern-glass-dom.html
          grep -q 'Минимальный технологический отступ рисунка от края панели — 10 мм' browser-artifacts/modern-glass-dom.html
          browser_screenshot "$MODERN_GLASS_URL" browser-artifacts/modern-glass.png

          FAMILY_URL="http://127.0.0.1:4173/?preset=family-classic&sourceSku=KM-FAMILY-001"
          browser_dump "$FAMILY_URL" browser-artifacts/family-dom.html
          grep -q 'data-startup-source="catalog"' browser-artifacts/family-dom.html
          grep -q 'data-preset-id="family-classic"' browser-artifacts/family-dom.html
          grep -q 'data-source-sku="KM-FAMILY-001"' browser-artifacts/family-dom.html
          grep -q 'data-visible-steles="3"' browser-artifacts/family-dom.html
          grep -q 'Семейный' browser-artifacts/family-dom.html
          browser_screenshot "$FAMILY_URL" browser-artifacts/family-classic.png

          CATALOG_GLASS_URL="http://127.0.0.1:4173/?catalog=catalog-glass-complete&sourceSku=%D0%A1%D0%A2-01"
          browser_dump "$CATALOG_GLASS_URL" browser-artifacts/catalog-glass-dom.html
          grep -q 'data-startup-source="catalog"' browser-artifacts/catalog-glass-dom.html
          grep -q 'data-catalog-product-id="catalog-glass-complete"' browser-artifacts/catalog-glass-dom.html
          grep -q 'data-source-sku="СТ-01"' browser-artifacts/catalog-glass-dom.html
          grep -q 'data-visible-steles="1"' browser-artifacts/catalog-glass-dom.html
          grep -q 'Стеклянная панель в гранитной рамке' browser-artifacts/catalog-glass-dom.html
          grep -q 'Монтаж в паз' browser-artifacts/catalog-glass-dom.html
          browser_screenshot "$CATALOG_GLASS_URL" browser-artifacts/catalog-glass-complete.png

          CATALOG_COMBINED_URL="http://127.0.0.1:4173/?catalog=catalog-granite-glass&sourceSku=%D0%A1%D0%A2-%D0%9A-01"
          browser_dump "$CATALOG_COMBINED_URL" browser-artifacts/catalog-combined-dom.html
          grep -q 'data-catalog-product-id="catalog-granite-glass"' browser-artifacts/catalog-combined-dom.html
          grep -q 'data-source-sku="СТ-К-01"' browser-artifacts/catalog-combined-dom.html
          grep -q 'data-visible-steles="2"' browser-artifacts/catalog-combined-dom.html
          browser_screenshot "$CATALOG_COMBINED_URL" browser-artifacts/catalog-granite-glass.png

          SOURCE_MODEL_URL="http://127.0.0.1:4173/?sourceSku=ERMIS-SINGLE-20"
          browser_dump "$SOURCE_MODEL_URL" browser-artifacts/source-model-20-dom.html
          grep -q 'data-startup-source="catalog"' browser-artifacts/source-model-20-dom.html
          grep -q 'data-source-sku="ERMIS-SINGLE-20"' browser-artifacts/source-model-20-dom.html
          grep -q 'data-source-catalog-model-id="ERMIS-SINGLE-20"' browser-artifacts/source-model-20-dom.html
          grep -q 'data-source-catalog-geometry="catalog-profile"' browser-artifacts/source-model-20-dom.html
          grep -q 'data-source-profile-id="ermis-single-20"' browser-artifacts/source-model-20-dom.html
          grep -q 'data-source-stone-code="К06"' browser-artifacts/source-model-20-dom.html
          grep -q '1100 × 600 × 70 мм' browser-artifacts/source-model-20-dom.html
          grep -q 'BLACK GABBRO' browser-artifacts/source-model-20-dom.html
          browser_screenshot "$SOURCE_MODEL_URL" browser-artifacts/source-model-20.png

          SOURCE_FAMILY_URL="http://127.0.0.1:4173/?sourceSku=ERMIS-FAMILY-16"
          browser_dump "$SOURCE_FAMILY_URL" browser-artifacts/source-family-16-dom.html
          grep -q 'data-source-catalog-model-id="ERMIS-FAMILY-16"' browser-artifacts/source-family-16-dom.html
          grep -q 'data-source-profile-id="ermis-family-16"' browser-artifacts/source-family-16-dom.html
          grep -q '900 × 1000 × 70 мм' browser-artifacts/source-family-16-dom.html
          browser_screenshot "$SOURCE_FAMILY_URL" browser-artifacts/source-family-16.png

          SOURCE_ELITE_URL="http://127.0.0.1:4173/?sourceSku=ERMIS-ELITE-25"
          browser_dump "$SOURCE_ELITE_URL" browser-artifacts/source-elite-25-dom.html
          grep -q 'data-source-catalog-model-id="ERMIS-ELITE-25"' browser-artifacts/source-elite-25-dom.html
          grep -q 'data-source-catalog-geometry="mesh-required"' browser-artifacts/source-elite-25-dom.html
          grep -q '2500 × 1200 × 300 мм' browser-artifacts/source-elite-25-dom.html
          grep -q 'точный скульптурный 3D-mesh ещё не загружен' browser-artifacts/source-elite-25-dom.html
          browser_screenshot "$SOURCE_ELITE_URL" browser-artifacts/source-elite-25-proxy.png

          MOBILE_URL="http://127.0.0.1:4173/?preset=modern-glass&sourceSku=KM-MOBILE-001"
          browser_dump "$MOBILE_URL" browser-artifacts/mobile-dom.html "390,844"
          grep -q 'data-webgl-ready="true"' browser-artifacts/mobile-dom.html
          grep -q 'data-preset-id="modern-glass"' browser-artifacts/mobile-dom.html
          grep -q 'Быстрый расчёт проекта' browser-artifacts/mobile-dom.html
          grep -q '>Рассчитать<' browser-artifacts/mobile-dom.html
          browser_screenshot "$MOBILE_URL" browser-artifacts/mobile-390x844.png "390,844"

      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 14
